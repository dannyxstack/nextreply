# NextReply 服务端部署：单个 Go 服务 + SQLite。
#
#   cp .env.example .env    # 填写配置
#   docker compose up -d --build
#
# 服务本身只提供 HTTP；HTTPS 由 Cloudflare Tunnel 或宿主机上的 nginx（Let's Encrypt）负责。
# 测试环境可以直接用 HTTP。详见 README.md。

services:
  server:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: nextreply-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_ADDR: ":8787"
      # 管理后台（.env 中设置 ADMIN_TOKEN 才启动）；下面只映射到宿主机 127.0.0.1
      ADMIN_ADDR: ":8788"
      DATABASE_PATH: /data/nextreply.db
      # 缺少时服务会启动即退出；在这里提前检查，让 docker compose up 直接报出原因
      TOKEN_SECRET: ${TOKEN_SECRET:?请在 .env 中设置 TOKEN_SECRET，可用 openssl rand -base64 48 生成}
    volumes:
      - data:/data
      - ./backups:/backups
    # 默认只对本机开放：生产环境由 Cloudflare Tunnel / nginx 在本机转发过来，不直接暴露服务。
    # 测试机需要局域网访问时在 .env 中设置 BIND_ADDR=0.0.0.0
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8787}:8787"
      # 管理后台永远只对宿主机本机开放，通过 SSH 隧道或 Cloudflare Tunnel + Access 访问
      - "127.0.0.1:${ADMIN_PORT:-8788}:8788"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  data:
